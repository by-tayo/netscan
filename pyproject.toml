[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netscan"
version = "0.1.0"
description = "Host discovery + port scan + banner grab for a local subnet"
requires-python = ">=3.8"
dependencies = ["typer>=0.9", "rich>=13.0"]

[project.optional-dependencies]
arp = ["scapy>=2.5.0"]

[project.scripts]
netscan = "network_scanner:main"

[tool.setuptools.packages.find]
where = ["src"]
